<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat-to-Buy</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    #log { border: 1px solid #ddd; border-radius: 8px; padding: 12px; height: 360px; overflow-y: auto; margin-bottom: 12px; }
    .msg { margin-bottom: 8px; }
    .msg.customer { text-align: right; color: #2a4d3e; }
    .msg.agent { text-align: left; color: #333; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 8px; }
    button { padding: 8px 16px; }
  </style>
</head>
<body>
  <h1>Chat-to-Buy</h1>
  <p>Placeholder chat UI — the surface a deep-link opens for step 4 of the loop.</p>
  <div id="log"></div>
  <form id="chat-form">
    <input id="chat-input" type="text" placeholder="Ask about a product…" autocomplete="off">
    <button type="submit">Send</button>
  </form>
  <script src="app.js"></script>
</body>
</html>
